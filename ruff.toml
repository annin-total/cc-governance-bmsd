target-version = "py39"
# server/ は自分の venv と ruff.toml を持つので、lint は server/ で行う。tmp/ は使い捨ての検証の記録。
extend-exclude = ["docs/", "server/", "tmp/"]

[lint]
ignore = ["FA100"]

[lint.per-file-ignores]
# hook は利用者の作業を妨げないため、意図的に例外を握り潰して必ず exit 0 で終える設計。
# 採取用スクリプトも同じ思想で書いているため、bare except / bare except-pass を許容する。
"scripts/capture_hook_stdin.py" = ["BLE001", "S112"]
