<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概況 — Claude Code 利用状況</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <span class="brand">Claude Code 利用状況</span>
  <nav>
    <a href="#" aria-current="page">概況</a>
    <a href="#">設定の適用状況</a>
    <a href="#">設定の効果</a>
    <a href="#">スキル・コマンドの利用</a>
  </nav>
  <span class="asof" id="asof"></span>
</header>

<div class="split">
  <aside class="rail">
    <div class="rail-in" id="rail" role="listbox" aria-label="指標"></div>
    <div class="csv">
      <div class="csv-k">利用明細（CSV）</div>
      <div class="csv-v">最終日 <b id="csv-last"></b></div>
      <button type="button" class="btn">CSV を取り込む</button>
      <p>取り込むと、照合率・コスト・設定の適用率の分母が更新されます。</p>
    </div>
  </aside>
  <main class="detail" id="detail" aria-live="polite"></main>
</div>

<footer>
  端末から送られた値です。コストとトークンは全社の利用明細（CSV）の値を正とします。監査・人事評価・勤怠管理には使いません。
</footer>

<script src="data.js"></script>
<script src="charts.js"></script>
<script src="metrics.js"></script>
<script src="app.js"></script>
</body>
</html>
