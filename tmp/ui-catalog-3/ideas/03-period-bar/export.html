<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エクスポート — Claude Code 利用状況</title>
<link rel="stylesheet" href="../../base/static/tokens.css">
<link rel="stylesheet" href="../../base/static/layout.css">
<link rel="stylesheet" href="../../base/static/components.css">
<link rel="stylesheet" href="idea.css">
<script src="../../data/data.js" defer></script>
<script src="export.js" defer></script>
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="brand" href="index.html">Claude Code 利用状況</a>
  <nav aria-label="画面">
    <a href="index.html">概況</a>
    <a href="../../base/policy.html">設定の適用状況</a>
    <a href="../../base/effect.html">設定の効果</a>
    <a href="../../base/assets.html">スキル・コマンドの利用</a>
  </nav>
  <span class="bar-end"><span class="asof">2026-09-29 時点</span><a href="export.html" aria-current="page">エクスポート</a></span>
</div></header>
<main class="wrap ex">
  <div class="page-head">
    <div><h1>エクスポート</h1><p class="lead">月ごとの全ログを、表ごとの CSV にまとめた ZIP で書き出します</p></div>
  </div>
  <section class="group" aria-label="書き出す">
    <h2 class="glabel">書き出す<span>記録・設定の報告・エラー・利用明細の 4 表 · 利用者名つき · 文字コードは UTF-8</span></h2>
    <form class="panel ex-form" method="get" action="#">
      <label class="field">月<select data-month></select></label>
      <button type="submit" class="btn">ZIP をダウンロード</button>
      <p class="ex-meta" data-month-meta></p>
    </form>
  </section>
  <section class="group" aria-label="取り込む">
    <h2 class="glabel">利用明細（CSV）を取り込む<span>利用明細はコストとトークンの正本です · 取り込み済みは 2026-09-28 まで</span></h2>
    <form class="panel ex-form" method="post" action="#">
      <label class="field">ファイル<input type="file" accept=".csv"></label>
      <button type="submit" class="btn">CSV を取り込む</button>
    </form>
  </section>
</main>
<footer class="wrap foot">端末から送られた値です。コストとトークンは全社の利用明細（CSV）の値を正とします。監査・人事評価・勤怠管理には使いません。</footer>
</body>
</html>
