<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>概況</title>
</head>
<body>
<h1>概況</h1>

{% if import_results %}
<h2>取込結果</h2>
<ul>
  {% for r in import_results %}
  {% if r.error %}
  <li>{{ r.file }}: 失敗（{{ r.error }}）</li>
  {% else %}
  <li>{{ r.file }}: {{ r.rows }} 行（破棄 {{ r.dropped }} 件）</li>
  {% endif %}
  {% endfor %}
</ul>
{% endif %}

<form method="post" action="{{ url_for('import_endpoint') }}">
  <button type="submit">CSV を取り込む</button>
</form>
</body>
</html>
